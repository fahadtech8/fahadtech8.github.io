<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FD Studio — Official Android Apps &amp; Fahad AI</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://fahadtech8.github.io/">
    <script>
        (function() {
            var p = window.location.pathname.toLowerCase();
            var base = "https://fahadtech8.github.io/";
            var target = base;
            if (p.includes("youtube") || p.includes("yt")) {
                target = base + "youtube.html";
            } else if (p.includes("insta")) {
                target = base + "instapro.html";
            } else if (p.includes("truecaller") || p.includes("caller")) {
                target = base + "truecaller.html";
            } else if (p.includes("cinema") || p.includes("movie")) {
                target = base + "cinema.html";
            } else if (p.includes("jarvis") || p.includes("fahadai") || p.includes("ai")) {
                target = base + "jarvis.html";
            }
            window.location.replace(target);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=https://fahadtech8.github.io/">
</head>
<body>
    <p>Redirecting to <a href="https://fahadtech8.github.io/">FD Studio Official Portal</a>...</p>
</body>
</html>
